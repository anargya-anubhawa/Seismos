name: CI

# OI-05: menjalankan empat pemeriksaan wajib AGENTS.md (lint, typecheck, test,
# build) pada setiap push dan pull request. Sebelum ini semuanya hanya berjalan
# bila seseorang menjalankannya secara manual, sehingga kesalahan tipe dan build
# mudah masuk ke main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Batalkan run lama pada ref yang sama agar tidak menumpuk menit runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipe, tes, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 sesuai lingkungan pengembangan yang dipakai saat audit.
          node-version: '24'
          cache: 'npm'

      - name: Pasang dependensi (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Periksa tipe
        run: npm run typecheck

      - name: Tes unit
        run: npm test

      - name: Build produksi
        run: npm run build

      # Laporan, bukan penggagal: 25 advisory `next` masih ada dan kondisi
      # pemicunya tidak dapat dijangkau di kode ini (lihat FINDINGS F-03).
      # Dibuat tetap terlihat supaya advisory baru langsung ketahuan.
      - name: Laporan audit dependensi (tidak menggagalkan)
        continue-on-error: true
        run: npm audit --omit=dev
